set-option -g default-terminal "screen-256color"

# use C-a, since it's on the home row and easier to hit than C-b
set -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
set -g base-index 1

# set history scrollback lines
set -g history-limit 100000

# vi is good
setw -g mode-keys vi

# mouse behavior
set -g mouse on

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

bind-key : command-prompt
bind-key r refresh-client
bind-key L clear-history

bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

# use vim-like keys for splits and windows
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Have splits open in the current directory
bind s split-window -c '#{pane_current_path}'
bind v split-window -c '#{pane_current_path}' -h

# Faster escape sequences (default is 500ms).
# This helps when exiting insert mode in Vim: http://superuser.com/a/252717/65504
set -s escape-time 50

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

bind-key C-o rotate-window

bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical
setw -g other-pane-height 25
setw -g other-pane-width 80

bind-key a last-pane
bind-key q display-panes
bind-key c new-window
bind-key t next-window
bind-key T previous-window

bind-key [ copy-mode
bind-key ] paste-buffer

# Resizing splits
bind-key -n C-Up resize-pane -U 5
bind-key -n C-Down resize-pane -D 5
bind-key -n C-Left resize-pane -L 5
bind-key -n C-Right resize-pane -R 5

# bind-key -t vi-copy v begin-selection
# bind-key -t vi-copy y copy-pipe "/usr/bin/xclip -i -selection clipboard"
# bind-key -t vi-copy y copy-pipe "clip.exe"
# unbind -t vi-copy Enter
# bind-key -t vi-copy Enter copy-pipe "/usr/bin/xclip -i -selection clipboard"
# bind-key -t vi-copy Enter copy-pipe "clip.exe"

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection
# bind-key -T copy-mode-vi y send -X copy-pipe "/usr/bin/xclip -i -selection clipboard"
#bind-key -T copy-mode-vi y send -X copy-pipe "clip.exe"
bind-key -T copy-mode-vi y send -X copy-pipe "wl-copy"

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
# bind-key -T copy-mode-vi Enter send -X copy-pipe "/usr/bin/xclip -i -selection clipboard"
#bind-key -T copy-mode-vi Enter send -X copy-pipe "clip.exe"
bind-key -T copy-mode-vi Enter send -X copy-pipe "wl-copy"

#set -g status on                       # turn the status bar on
#set -g status-utf8 on                  # set utf-8 for the status bar
#set -g status-interval 1               # set update frequencey (default 15 seconds)
#set -g status-justify left             # center window list for clarity

# visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on
setw -g window-status-activity-style fg=colour3,bold,noreverse
set -g display-time 2000

# colours — uses ANSI palette from terminal (acme-hbz)
set -g status-style bg=colour7,fg=colour0
setw -g window-status-style fg=colour8

set -g pane-border-style fg=colour7
set -g pane-active-border-style fg=colour0
set -g pane-border-indicators colour
set -g status-right-length 0
set -g status-right ""

# messages and mode indicators
set -g message-style bg=default,fg=colour3,bold
set -g mode-style bg='#EEEEA7',fg='#424242'

set -g set-titles on
set -g set-titles-string '#W'

set -g status-position top

set -g status-left ''
set -g window-status-format "  #[fg=colour8]#I #(echo '#{pane_current_path}' | sed \"s|$HOME|~|\" | rev | cut -d/ -f1-2 | rev) #W  "
set -g window-status-current-format "#[bg=colour15,fg=colour0,bold] #I #(echo '#{pane_current_path}' | sed \"s|$HOME|~|\" | rev | cut -d/ -f1-2 | rev) #W "

set -g window-status-separator ""

# Allow OSC passthrough for terminal notifications (needed for Claude Code)
set -g allow-passthrough on

# Forward terminal focus events to panes (Claude Code presence, vim FocusGained)
set -g focus-events on

set -g repeat-time 0
set -g renumber-windows on

set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Forward OSC-8 hyperlinks to ghostty (tmux strips them by default).
set -as terminal-features ",xterm-ghostty:hyperlinks"

# Plugins (tpm).
# Crash-safety substrate for claude-manager cold resume. resurrect keeps
# a machine-readable record of every session, window, pane, layout, cwd
# and running command; continuum refreshes it in the background. A
# machine dying takes the processes either way — what has to survive is
# the record of what was there, and which Claude conversation each pane
# held.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir '~/.local/state/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'

# The bundled `ps` strategy prints every child of the pane shell, one per
# line, so a Claude pane's tool shell lands in the save file as a stray
# record. pane-tty keeps the child sharing the pane's tty. Installed by
# `make tmux`; resurrect falls back to `ps` if the file is missing.
set -g @resurrect-save-command-strategy 'pane-tty'

# Save only — restore is claude-manager's job. It has to reconcile the
# registry and resume the right conversation per pane, so an unattended
# restore would recreate sessions that were shut down deliberately and
# re-run claude everywhere behind the manager's back.
set -g @continuum-restore 'off'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'

# The other route into a blind restore is resurrect's own prefix+C-r,
# which rebuilds every session at once. Unbind it after tpm has loaded
# the plugin — setting @resurrect-restore empty does not work, since
# resurrect reads an empty option as unset and falls back to C-r.
# prefix+C-s still saves by hand.
unbind -T prefix C-r
